[package]
name = "everything-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime file and content search for Linux (GUI)"

[[bin]]
name = "everything-gui"
path = "src/main.rs"

[dependencies]
everything-core = { path = "../core" }
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.18"
dark-light = "1.1"
