[package]
name = "easysearch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime file and content search for Linux (GUI)"

[lib]
name = "easysearch_gui"
path = "src/lib.rs"

[[bin]]
name = "easysearch-gui"
path = "src/main.rs"

[dependencies]
easysearch-core = { path = "../core" }
# Display backends: Wayland-first, X11 second. winit connects to Wayland
# whenever WAYLAND_DISPLAY is set (it prefers Wayland because an X11 display
# can exist under Wayland via XWayland) and falls back to X11 when only DISPLAY
# is present. To force X11, launch with WAYLAND_DISPLAY unset:
#   env -u WAYLAND_DISPLAY easysearch-gui
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dark-light = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
ksni = { version = "0.3", features = ["blocking"] }
sha2 = "0.11.0"
