[package]
name = "everything-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everything for Linux as one file: the GUI and the search engine daemon in a single binary"

[lib]
name = "everything_app"
path = "src/lib.rs"

[[bin]]
name = "everything-linux"
path = "src/main.rs"

[dependencies]
everything-core = { path = "../core" }
everything-gui = { path = "../gui" }
everything-daemon = { path = "../daemon" }
serde_json = "1"
libc = "0.2"
