[package]
name = "easysearch-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EasySearch as one file: the GUI and the search engine daemon in a single binary"

[lib]
name = "easysearch_app"
path = "src/lib.rs"

[[bin]]
name = "easysearch"
path = "src/main.rs"

[dependencies]
easysearch-core = { path = "../core" }
easysearch-gui = { path = "../gui" }
easysearch-daemon = { path = "../daemon" }
serde_json = "1"
libc = "0.2"
