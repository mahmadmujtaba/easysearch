[package]
name = "easysearch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime file and content search for Linux (CLI)"

[[bin]]
name = "easysearch-cli"
path = "src/main.rs"

[dependencies]
easysearch-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
