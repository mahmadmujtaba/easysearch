[package]
name = "easysearch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime search engine: owns the index and answers JSON frames on stdin/stdout (a child of the app)"

[lib]
name = "easysearch_daemon"
path = "src/lib.rs"

[[bin]]
name = "easysearch-daemon"
path = "src/main.rs"

[dependencies]
easysearch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
