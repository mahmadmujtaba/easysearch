# Formatting, a compile of every target, and the unit/integration test suite — run
# on demand only.
#
#   manual dispatch    fmt + check + test (Actions ▸ checks ▸ Run workflow)
#
# Nothing triggers this automatically. The only workflow that runs on its own is
# the packaging build, and that only for a `v*` tag (`packages.yml`); ordinary
# pushes to `master` and pull requests trigger nothing. This needs no secrets.
name: checks

on:
  workflow_dispatch:

# Read-only: this workflow never writes to the repository.
permissions:
  contents: read

# A newer run of the same branch supersedes an in-flight one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · check · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust toolchain
        # `rustfmt` is not in the minimal profile; the rest is enough for a
        # `cargo check`/`test` (clippy is intentionally not run here).
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component rustfmt
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-

      - name: Install GUI headers (best effort)
        run: |
          # The GUI stack (winit/glutin) dlopen()s its libraries, so these are
          # not normally needed; they are a safety net in case a dependency
          # links instead. Optional, so a package rename on a future runner
          # image cannot break the pipeline.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxrender-dev \
            || echo "note: optional GUI dev headers unavailable; continuing"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check (all targets)
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked
