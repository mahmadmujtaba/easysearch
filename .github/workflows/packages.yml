# Build the Debian and RPM packages, and turn a version tag into a release.
#
#   push to master     build .deb + .rpm and upload them as a run artifact
#   pull request       the same build, so packaging breakage is caught before
#                      the change is merged
#   push of a v* tag   the same build, then attach the packages to the GitHub
#                      release for that tag
#   manual dispatch    build on demand
#
# A merged pull request *is* a push to `master`, so that trigger is what "every
# PR that lands" means here; a direct push builds too, on purpose, so the
# artifacts always match the branch.
#
# No secrets are needed — the release job uses the automatic `GITHUB_TOKEN`.
name: packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Build jobs only read the repository; the release job overrides this.
permissions:
  contents: read

# A newer push supersedes an in-flight build. Tag builds are never cancelled,
# so a release is always produced for a tag that was pushed.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: .deb + .rpm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # dpkg-deb + dpkg-shlibdeps build the .deb; `rpm` provides rpmbuild.
          # desktop-file-utils (desktop-file-validate), appstream (appstreamcli)
          # and librsvg2-bin (rsvg-convert, for the PNG icons) let the scripts
          # validate metadata and render icons instead of skipping them.
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev fakeroot librsvg2-bin desktop-file-utils appstream

      - name: Install GUI headers (best effort)
        run: |
          # The GUI stack (winit/glutin) dlopen()s its libraries, so these are
          # not normally needed; they are a safety net in case a dependency
          # links instead. Optional, so a package rename on a future runner
          # image cannot break the pipeline.
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxrender-dev \
            || echo "note: optional GUI dev headers unavailable; continuing"

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Build .deb
        run: ./scripts/package-deb.sh

      - name: Build .rpm
        run: ./scripts/package-rpm.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: easysearch-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the release
    needs: packages
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to create the release and upload its assets.
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # `gh` needs the repository remote, and `--generate-notes` needs the
          # commit and tag history to work out what changed since the last tag.
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v7
        with:
          name: easysearch-packages
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ls -l dist
          # Idempotent: a re-run of the same tag updates that release instead of
          # failing.
          gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" \
                  --title "EasySearch $tag" \
                  --generate-notes
          gh release upload "$tag" dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber

      - name: Summarise
        run: |
          set -euo pipefail
          {
              echo "## EasySearch ${{ github.ref_name }}"
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
