# Build the Debian and RPM packages, and turn a version tag into a release.
#
#   push to master     build .deb + .rpm and upload them as a run artifact
#   pull request       the same build, so packaging breakage is caught before
#                      the change is merged
#   push of a v* tag   the same build, then attach the packages to the GitHub
#                      release for that tag
#   manual dispatch    build on demand
#
# A merged pull request *is* a push to `master`, so that trigger is what "every
# PR that lands" means here; a direct push builds too, on purpose, so the
# artifacts always match the branch.
#
# No secrets are needed — the release job uses the automatic `GITHUB_TOKEN`.
name: packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Build jobs only read the repository; the release job overrides this.
permissions:
  contents: read

# A newer push supersedes an in-flight build. Tag builds are never cancelled,
# so a release is always produced for a tag that was pushed.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: .deb + .rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The arm64 row is best-effort: a missing arm runner must not block the
    # amd64 packages or the release.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            experimental: false
          - runner: ubuntu-24.04-arm
            arch: arm64
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Stamp the metainfo release
        # Keep the packaged AppStream <release> in step with VERSION.
        run: ./scripts/sync-metainfo-release.sh

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # dpkg-deb + dpkg-shlibdeps build the .deb; `rpm` provides rpmbuild.
          # desktop-file-utils (desktop-file-validate), appstream (appstreamcli)
          # and librsvg2-bin (rsvg-convert, for the PNG icons) let the scripts
          # validate metadata and render icons instead of skipping them.
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev fakeroot librsvg2-bin desktop-file-utils appstream

      - name: Install GUI headers (best effort)
        run: |
          # The GUI stack (winit/glutin) dlopen()s its libraries, so these are
          # not normally needed; they are a safety net in case a dependency
          # links instead. Optional, so a package rename on a future runner
          # image cannot break the pipeline.
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxrender-dev \
            || echo "note: optional GUI dev headers unavailable; continuing"

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Build .deb
        run: ./scripts/package-deb.sh

      - name: Build .rpm
        run: ./scripts/package-rpm.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm > "SHA256SUMS.${{ matrix.arch }}"
          cat "SHA256SUMS.${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: easysearch-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the release
    needs: packages
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to create the release and upload its assets.
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # `gh` needs the repository remote, and `--generate-notes` needs the
          # commit and tag history to work out what changed since the last tag.
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v7
        with:
          # Every arch's artifact, flattened into dist/.
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          # One manifest over every arch's packages.
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This run's own ref, rather than `ref_name`, which is only assumed to
          # name the tag being built.
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
              v*) ;;
              *) echo "not a version tag build: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ls -l dist
          # Idempotent: re-running a tag updates that release instead of
          # failing.
          gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" \
                  --title "EasySearch $tag" \
                  --generate-notes
          gh release upload "$tag" dist/*.deb dist/*.rpm dist/SHA256SUMS dist/SHA256SUMS.* --clobber
          # Prove it landed. A release that was silently not created — or that
          # lost its assets — has to fail the run, not pass as success. At least
          # one .deb, one .rpm and the combined SHA256SUMS are expected.
          gh release view "$tag" --json tagName,assets \
              --jq 'if (.assets | length) < 3
                    then error("release \(.tagName) has \(.assets | length) assets, expected at least 3")
                    else "\(.tagName): \(.assets | length) assets published" end'

      - name: Summarise
        run: |
          set -euo pipefail
          {
              echo "## EasySearch ${{ github.ref_name }}"
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
