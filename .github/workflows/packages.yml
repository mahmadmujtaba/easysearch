# Build the Debian and RPM packages whenever master changes.
#
# A merged pull request *is* a push to `master`, so that is the trigger that
# means "every PR that lands". A direct push builds too — deliberately, so the
# artifacts always match the branch — and *Run workflow* rebuilds on demand.
#
# No secrets and no root: `dpkg-deb` builds the .deb from the release binaries,
# and `rpmbuild` builds the .rpm from source, so the workspace is compiled twice
# (once here, once inside rpmbuild). Both artifacts are uploaded to the run.
name: packages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The job only reads the repository and uploads workflow artifacts.
permissions:
  contents: read

# A newer push supersedes an in-flight build.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: .deb + .rpm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # dpkg-deb + dpkg-shlibdeps build the .deb; `rpm` provides rpmbuild.
          # desktop-file-utils (desktop-file-validate), appstream (appstreamcli)
          # and librsvg2-bin (rsvg-convert, for the PNG icons) let the scripts
          # validate metadata and render icons instead of skipping them.
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev fakeroot librsvg2-bin desktop-file-utils appstream

      - name: Install GUI headers (best effort)
        run: |
          # The GUI stack (winit/glutin) dlopen()s its libraries, so these are
          # not normally needed; they are a safety net in case a dependency
          # links instead. Optional, so a package rename on a future runner
          # image cannot break the pipeline.
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxrender-dev \
            || echo "note: optional GUI dev headers unavailable; continuing"

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Build .deb
        run: ./scripts/package-deb.sh

      - name: Build .rpm
        run: ./scripts/package-rpm.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: easysearch-${{ github.ref_name }}-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
