# Generated by scripts/install-deps.sh for this machine.
# Links Rust binaries with rustup's bundled rust-lld + system crt objects,
# so no C compiler / pkg-config is required. If your setup differs, re-run
# scripts/install-deps.sh to regenerate this file.
[target.x86_64-unknown-linux-gnu]
linker = "/home/ahmad/Workspace/Personal/everything-for-linux/scripts/rust-lld-wrapper.sh"
rustflags = [
  "-C", "link-arg=/usr/lib/x86_64-linux-gnu/crt1.o",
  "-C", "link-arg=/usr/lib/x86_64-linux-gnu/crti.o",
  "-C", "link-arg=/usr/lib/x86_64-linux-gnu/crtn.o",
  "-C", "link-arg=--dynamic-linker=/lib64/ld-linux-x86-64.so.2",
  "-C", "link-arg=-L/usr/lib/x86_64-linux-gnu",
  "-C", "link-arg=-L/home/ahmad/.local/lib",
]
