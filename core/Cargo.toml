[package]
name = "everything-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime filename + content search engine (ripgrep engine embedded)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "7"
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
