[package]
name = "easysearch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime filename + content search engine (ripgrep engine embedded)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "7"
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
# The brand asset is decoded and rasterised on demand; only PNG is needed.
image = { version = "0.25", default-features = false, features = ["png"] }
